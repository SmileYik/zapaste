openapi: 3.0.0
info:
  title: Zapaste API
  description: |
    A Pastebin service built using Zig and the Zap web framework.
    
    **Key Features:**
    - Paginated retrieval of public pastes.
    - Password-protected paste access via POST.
    - Automatic sensitive data stripping (passwords removed from responses).
    - Support for `raw` text output via query parameters.
  version: 1.0.0

paths:
  /api/paste:
    get:
      summary: List Public Pastes
      description: Returns a paginated summary of all pastes not marked as private.
      parameters:
        - name: page_size
          in: query
          description: "Number of items per page (Default: 10)"
          schema:
            type: integer
            default: 10
        - name: page_no
          in: query
          description: "Current page number (Default: 1)"
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Paginated summary list retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PastePageResult'

    post:
      summary: Create New Paste
      description: |
        Supports two content types:
        1. `application/json`: Direct JSON object.
        2. `application/x-www-form-urlencoded`: JSON string passed in the `paste` field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Paste'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                paste:
                  type: string
                  description: JSON serialized string of a Paste object.
              required:
                - paste
      responses:
        '200':
          description: Created successfully. Returns the saved object with assigned ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasteResult'

  /api/paste/{name}:
    get:
      summary: Get Unlocked Paste
      description: |
        Retrieves a paste by name. This endpoint only works for pastes without password protection. 
        If a paste is protected, this will return an error.
      parameters:
        - name: name
          in: path
          required: true
          description: Unique name/slug of the paste.
          schema:
            type: string
        - name: raw
          in: query
          description: If "true", returns the raw string content instead of a JSON object.
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        '200':
          description: Success. Returns JSON by default or plain text if raw=true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasteResult'
            text/plain:
              schema:
                type: string
        '404':
          description: Paste not found or name is empty.

    post:
      summary: Get Locked Paste
      description: Retrieves a password-protected paste. The password must be provided in the request body.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: raw
          in: query
          schema:
            type: string
            enum: ["true", "false"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordModel'
      responses:
        '200':
          description: Verification successful. Returns paste content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasteResult'
            text/plain:
              schema:
                type: string
        '500':
          description: Verification failed (Incorrect password or missing payload).

    delete:
      summary: Delete Unlocked Paste
      description: |
        Delete a paste by name. This endpoint only works for pastes without password protection. 
        If a paste is protected, this will return an error.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Delete successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasteResult'
            text/plain:
              schema:
                type: string
        '500':
          description: Verification failed (Incorrect password or missing payload).
  
  /api/paste/{name}/delete:
    delete:
      summary: Delete Unlocked Paste
      description: |
        Delete a paste by name. This endpoint only works for pastes without password protection. 
        If a paste is protected, this will return an error.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Delete successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasteResult'
            text/plain:
              schema:
                type: string
        '500':
          description: Verification failed (Incorrect password or missing payload).

    post:
      summary: Delete Locked Paste
      description: Delete a password-protected paste. The password must be provided in the request body.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordModel'
      responses:
        '200':
          description: Delete successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasteResult'
            text/plain:
              schema:
                type: string
        '500':
          description: Verification failed (Incorrect password or missing payload).


components:
  schemas:
    # Core Model: Maps to Zig `Paste` struct
    Paste:
      type: object
      properties:
        id: { type: integer, format: int64, nullable: true }
        name: { type: string, nullable: true }
        content: { type: string, nullable: true, description: "The actual text body of the paste." }
        content_type: { type: string, nullable: true, description: "MIME type or language identifier." }
        attachements: { type: string, nullable: true }
        private: { type: boolean, nullable: true }
        read_only: { type: boolean, nullable: true }
        editable: { type: boolean, nullable: true }
        has_password: { type: boolean, nullable: true, description: "Calculated field indicating protection." }
        read_count: { type: integer, format: int64, nullable: true }
        burn_after_reads: { type: integer, format: int64, nullable: true }
        create_at: { type: integer, format: int64, nullable: true, description: "Unix timestamp." }
        expiration_at: { type: integer, format: int64, nullable: true, description: "Unix timestamp." }
        profiles: { type: string, nullable: true }

    # Summary Model: Maps to Zig `Summary` struct
    PasteSummary:
      type: object
      properties:
        id: { type: integer, format: int64, nullable: true }
        name: { type: string, nullable: true }
        content_type: { type: string, nullable: true }
        read_only: { type: boolean, nullable: true }
        has_password: { type: boolean, nullable: true }
        read_count: { type: integer, format: int64, nullable: true }
        create_at: { type: integer, format: int64, nullable: true }

    # Pagination Wrapper: Maps to PageList(Summary)
    PastePage:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/PasteSummary'
        page_size: { type: integer }
        page_no: { type: integer }
        page_count: { type: integer }
        total: { type: integer, format: int64 }

    # Request model for locked pastes
    PasswordModel:
      type: object
      properties:
        password: { type: string, nullable: true }

    # Generic Result Wrapper: Maps to common.Result.create(T)
    PasteResult:
      type: object
      properties:
        code: { type: integer, example: 200, description: "Business logic status code." }
        data:
          allOf:
            - $ref: '#/components/schemas/Paste'
          nullable: true
        message: { type: string, nullable: true }

    PastePageResult:
      type: object
      properties:
        code: { type: integer, example: 200 }
        data:
          allOf:
            - $ref: '#/components/schemas/PastePage'
          nullable: true
        message: { type: string, nullable: true }
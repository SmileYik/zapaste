openapi: 3.0.0
info:
  title: Paste Service API
  description: A Zig-based Pastebin service with support for file attachments and password-protected content.
  version: 1.0.0

paths:
  /api/paste:
    get:
      summary: List public pastes
      description: Returns a paginated summary of publicly available pastes.
      parameters:
        - name: page_size
          in: query
          schema:
            type: integer
            default: 10
        - name: page_no
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Paginated list of paste summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PastePageResult'
    post:
      summary: Create a new paste
      description: Create a paste with optional file attachments. Supports JSON or Multipart/form-data.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Paste'
          multipart/form-data:
            schema:
              type: object
              properties:
                paste:
                  $ref: '#/components/schemas/Paste'
                file:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Paste created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasteModelResult'

  /api/paste/{name}:
    get:
      summary: Get an unlocked paste
      description: Retrieve a paste by name if it has no password.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: raw
          in: query
          description: If true, returns the raw text content only.
          schema:
            type: boolean
      responses:
        '200':
          description: Paste details or raw text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasteModelResult'
            text/plain:
              schema:
                type: string
        '404':
          description: Paste not found or requires password

    post:
      summary: Get a locked paste
      description: Retrieve a password-protected paste.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordModel'
      responses:
        '200':
          description: Paste details retrieved successfully
        '500':
          description: Incorrect password or missing body

    put:
      summary: Update a paste
      description: Updates an existing paste. Requires password if the paste is protected. Supports JSON or Multipart/form-data.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasteModel'
          multipart/form-data:
            schema:
              type: object
              properties:
                paste:
                  $ref: '#/components/schemas/UpdatePasteModel'
                file:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Paste updated
        '404':
          description: Not found or no update payload

    delete:
      summary: Delete a paste
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted successfully

  /api/paste/{name}/delete:
    post:
      summary: Delete a locked paste
      description: Deletes a paste after password verification.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordModel'
      responses:
        '200':
          description: Deleted successfully

  /api/paste/{name}/file/name/{filename}:
    get:
      summary: Download paste file
      description: Download an attachment using an ephemeral token.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          description: Encrypted AuthModel token
          schema:
            type: string
      responses:
        '200':
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Token expired or unauthorized

    post:
      summary: Request download token
      description: Verify password to receive a redirect with a download token.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordModel'
      responses:
        '303':
          description: Redirecting to download path with token

components:
  schemas:
    Result:
      type: object
      properties:
        code:
          type: integer
          example: 200
        data:
          type: object
          nullable: true
        message:
          type: string
          nullable: true

    Paste:
      type: object
      properties:
        id: { type: integer, format: int64, nullable: true }
        name: { type: string, nullable: true }
        content: { type: string, nullable: true }
        content_type: { type: string, nullable: true }
        attachements: { type: string, nullable: true, description: "Comma separated file IDs" }
        private: { type: boolean, nullable: true }
        read_only: { type: boolean, nullable: true }
        has_password: { type: boolean, nullable: true }
        password: { type: string, nullable: true }
        read_count: { type: integer, format: int64, nullable: true }
        burn_after_reads: { type: integer, format: int64, nullable: true }
        latest_read_at: { type: integer, format: int64, nullable: true }
        create_at: { type: integer, format: int64, nullable: true }
        expiration_at: { type: integer, format: int64, nullable: true }
        profiles: { type: string, nullable: true }

    Summary:
      type: object
      properties:
        id: { type: integer, format: int64, nullable: true }
        name: { type: string, nullable: true }
        content_type: { type: string, nullable: true }
        read_only: { type: boolean, nullable: true }
        has_password: { type: boolean, nullable: true }
        read_count: { type: integer, format: int64, nullable: true }
        latest_read_at: { type: integer, format: int64, nullable: true }
        create_at: { type: integer, format: int64, nullable: true }
        expiration_at: { type: integer, format: int64, nullable: true }

    File:
      type: object
      properties:
        id: { type: integer, format: int64, nullable: true }
        hash: { type: string, nullable: true }
        filename: { type: string, nullable: true }
        filesize: { type: integer, nullable: true }
        filepath: { type: string, nullable: true }
        mimetype: { type: string, nullable: true }

    PasteModel:
      type: object
      properties:
        paste: { $ref: '#/components/schemas/Paste' }
        files:
          type: array
          items: { $ref: '#/components/schemas/File' }
          nullable: true

    PasswordModel:
      type: object
      properties:
        password: { type: string, nullable: true }

    UpdatePasteModel:
      type: object
      properties:
        password: { type: string, nullable: true }
        paste: { $ref: '#/components/schemas/Paste' }

    PasteModelResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/PasteModel' }

    PastePageResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              properties:
                list:
                  type: array
                  items: { $ref: '#/components/schemas/Summary' }
                page_size: { type: integer }
                page_no: { type: integer }
                page_count: { type: integer }
                total: { type: integer, format: int64 }
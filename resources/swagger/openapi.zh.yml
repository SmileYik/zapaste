openapi: 3.0.0
info:
  title: 剪贴板服务 API (Paste Service API)
  description: 基于 Zig 开发的剪贴板服务，支持文件附件上传及密码保护内容。
  version: 1.0.0

paths:
  /api/paste:
    get:
      summary: 列出公开的剪贴板内容
      description: 返回公开剪贴板内容的分页摘要列表。
      parameters:
        - name: page_size
          in: query
          description: 每页展示的数量
          schema:
            type: integer
            default: 10
        - name: page_no
          in: query
          description: 当前页码
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: 成功获取分页摘要列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PastePageResult'
    post:
      summary: 创建新的剪贴板内容
      description: 创建包含可选文件附件的剪贴板项。支持 JSON 或 Multipart/form-data 格式。
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Paste'
          multipart/form-data:
            schema:
              type: object
              properties:
                paste:
                  $ref: '#/components/schemas/Paste'
                file:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: 剪贴板内容创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasteModelResult'

  /api/paste/{name}:
    get:
      summary: 获取未加密的剪贴板内容
      description: 通过名称获取没有设置密码保护的剪贴板详情。
      parameters:
        - name: name
          in: path
          required: true
          description: 剪贴板唯一标识名
          schema:
            type: string
        - name: raw
          in: query
          description: 如果为 true，则仅返回原始文本内容。
          schema:
            type: boolean
      responses:
        '200':
          description: 剪贴板详情或原始文本内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasteModelResult'
            text/plain:
              schema:
                type: string
        '404':
          description: 未找到剪贴板或该内容受密码保护

    post:
      summary: 获取受密码保护的剪贴板内容
      description: 提供密码以获取受保护的剪贴板详情。
      parameters:
        - name: name
          in: path
          required: true
          description: 剪贴板唯一标识名
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordModel'
      responses:
        '200':
          description: 成功获取剪贴板详情
        '500':
          description: 密码错误或请求体缺失

    put:
      summary: 更新剪贴板内容
      description: 更新现有的剪贴板项。如果内容受保护，则需要提供密码。支持 JSON 或 Multipart/form-data 格式。
      parameters:
        - name: name
          in: path
          required: true
          description: 剪贴板唯一标识名
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasteModel'
          multipart/form-data:
            schema:
              type: object
              properties:
                paste:
                  $ref: '#/components/schemas/UpdatePasteModel'
                file:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: 更新成功
        '404':
          description: 未找到内容或无更新负载

    delete:
      summary: 删除剪贴板内容
      parameters:
        - name: name
          in: path
          required: true
          description: 剪贴板唯一标识名
          schema:
            type: string
      responses:
        '200':
          description: 删除成功

  /api/paste/{name}/delete:
    post:
      summary: 删除受密码保护的剪贴板内容
      description: 在验证密码后删除指定的剪贴板项。
      parameters:
        - name: name
          in: path
          required: true
          description: 剪贴板唯一标识名
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordModel'
      responses:
        '200':
          description: 删除成功

  /api/paste/{name}/file/name/{filename}:
    get:
      summary: 下载剪贴板附件
      description: 使用临时令牌 (Token) 下载附件。
      parameters:
        - name: name
          in: path
          required: true
          description: 剪贴板唯一标识名
          schema:
            type: string
        - name: filename
          in: path
          required: true
          description: 文件名
          schema:
            type: string
        - name: token
          in: query
          description: 经过加密的 AuthModel 授权令牌
          schema:
            type: string
      responses:
        '200':
          description: 文件下载流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: 令牌过期或未授权

    post:
      summary: 请求文件下载令牌
      description: 验证密码以获取带有下载令牌的重定向地址。
      parameters:
        - name: name
          in: path
          required: true
          description: 剪贴板唯一标识名
          schema:
            type: string
        - name: filename
          in: path
          required: true
          description: 文件名
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordModel'
      responses:
        '303':
          description: 验证成功，重定向至带 Token 的下载路径

components:
  schemas:
    Result:
      type: object
      description: 统一响应结构
      properties:
        code:
          type: integer
          description: 业务状态码
          example: 200
        data:
          type: object
          description: 响应数据
          nullable: true
        message:
          type: string
          description: 响应消息
          nullable: true

    Paste:
      type: object
      description: 剪贴板核心实体
      properties:
        id: { type: integer, format: int64, nullable: true, description: "唯一 ID" }
        name: { type: string, nullable: true, description: "剪贴板名称/标识" }
        content: { type: string, nullable: true, description: "文本内容" }
        content_type: { type: string, nullable: true, description: "内容类型" }
        attachements: { type: string, nullable: true, description: "逗号分隔的文件 ID 列表" }
        private: { type: boolean, nullable: true, description: "是否为私有" }
        read_only: { type: boolean, nullable: true, description: "是否只读" }
        editable: { type: boolean, nullable: true, description: "是否可编辑" }
        has_password: { type: boolean, nullable: true, description: "是否有密码保护" }
        password: { type: string, nullable: true, description: "内容密码" }
        read_count: { type: integer, format: int64, nullable: true, description: "阅读次数" }
        burn_after_reads: { type: integer, format: int64, nullable: true, description: "阅后即焚限制次数" }
        latest_read_at: { type: integer, format: int64, nullable: true, description: "最后阅读时间戳" }
        create_at: { type: integer, format: int64, nullable: true, description: "创建时间戳" }
        expiration_at: { type: integer, format: int64, nullable: true, description: "过期时间戳" }
        profiles: { type: string, nullable: true, description: "配置项/属性" }

    Summary:
      type: object
      description: 剪贴板列表摘要信息
      properties:
        id: { type: integer, format: int64, nullable: true }
        name: { type: string, nullable: true }
        content_type: { type: string, nullable: true }
        read_only: { type: boolean, nullable: true }
        editable: { type: boolean, nullable: true }
        has_password: { type: boolean, nullable: true }
        read_count: { type: integer, format: int64, nullable: true }
        latest_read_at: { type: integer, format: int64, nullable: true }
        create_at: { type: integer, format: int64, nullable: true }
        expiration_at: { type: integer, format: int64, nullable: true }

    File:
      type: object
      description: 附件文件信息
      properties:
        id: { type: integer, format: int64, nullable: true }
        hash: { type: string, nullable: true, description: "文件 Hash 值" }
        filename: { type: string, nullable: true, description: "文件名" }
        filesize: { type: integer, nullable: true, description: "文件大小 (字节)" }
        filepath: { type: string, nullable: true, description: "物理存储路径" }
        mimetype: { type: string, nullable: true, description: "MIME 类型" }

    PasteModel:
      type: object
      description: 包含剪贴板详情及其关联文件的组合模型
      properties:
        paste: { $ref: '#/components/schemas/Paste' }
        files:
          type: array
          description: 关联的附件列表
          items: { $ref: '#/components/schemas/File' }
          nullable: true

    PasswordModel:
      type: object
      description: 密码验证模型
      properties:
        password: { type: string, nullable: true, description: "访问密码" }

    UpdatePasteModel:
      type: object
      description: 更新剪贴板所需的负载模型
      properties:
        password: { type: string, nullable: true, description: "原始或校验密码" }
        paste: { $ref: '#/components/schemas/Paste' }

    PasteModelResult:
      description: 返回单个剪贴板模型的响应
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/PasteModel' }

    PastePageResult:
      description: 返回剪贴板分页摘要的响应
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              type: object
              properties:
                list:
                  type: array
                  items: { $ref: '#/components/schemas/Summary' }
                page_size: { type: integer, description: "每页数量" }
                page_no: { type: integer, description: "当前页码" }
                page_count: { type: integer, description: "总页数" }
                total: { type: integer, format: int64, description: "总记录数" }
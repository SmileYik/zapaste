name: Zig CI

on:
  push:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'build.*'
      - '.github/workflows/zig.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'build.*'
      - '.github/workflows/zig.yml'

jobs:

  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: 
        - "x86_64-linux"
        - "x86_64-linux-musl"
        - "x86_64-macos"
        - "x86_64-freebsd"
        - "x86_64-netbsd"
        - "arm-freebsd"
        - "arm-netbsd"
        - "aarch64-linux"
        - "aarch64-linux-musl"
        - "aarch64-macos"
        - "aarch64-freebsd"
        - "aarch64-netbsd"
        - "riscv64-linux"
        - "riscv64-linux-musl"
        - "riscv64-freebsd"
        - "loongarch64-linux"
        - "loongarch64-linux-musl"
        - "powerpc-freebsd"
        - "powerpc-netbsd"
        - "riscv32-linux"
        - "riscv32-linux-musl"

    steps:

    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Zig
      uses: mlugg/setup-zig@v2.1.0
      with:
        version: "0.15.2"

    - name: Build Zapaste
      run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: zapaste-${{ matrix.target }}
        path: "${{ github.workspace }}/zig-out/bin/zapaste"
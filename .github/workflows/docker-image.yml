name: Docker Image CI

on:
  push:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'build.*'
      - '.github/**'
      - '.dockerignore'
      - 'Dockerfile'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'build.*'
      - '.github/**'
      - '.dockerignore'
      - 'Dockerfile'
    
permissions:
  contents: read
  packages: write
  
jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v5

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
        
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: SmileYik/zapaste:latest